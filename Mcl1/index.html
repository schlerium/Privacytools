<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymize Tool</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff00; padding: 20px; text-align: center; }
        .terminal { border: 1px solid #00ff00; padding: 20px; background: #000; box-shadow: 0 0 15px #00ff00; max-width: 500px; margin: auto; }
        input { display: none; }
        .btn { display: block; border: 1px solid #00ff00; padding: 15px; margin: 10px 0; cursor: pointer; text-transform: uppercase; }
        .btn:hover { background: #00ff00; color: #000; }
        #status { font-size: 0.8rem; margin-top: 10px; color: #888; }
    </style>
</head>
<body>

<div class="terminal">
    <h3>METADATA_SCRUBBER_V1</h3>
    <p>Status: Encryption Ready</p>
    
    <label for="fileIn" class="btn">Select Source Image</label>
    <input type="file" id="fileIn" accept="image/*">
    
    <div id="status">Awaiting input...</div>
    
    <button id="cleanBtn" class="btn" style="display:none; width:100%;">Scrub & Download</button>
</div>

<canvas id="vault" style="display:none;"></canvas>

<script>
    const fileIn = document.getElementById('fileIn');
    const cleanBtn = document.getElementById('cleanBtn');
    const status = document.getElementById('status');
    const vault = document.getElementById('vault');
    const ctx = vault.getContext('2d');

    fileIn.onchange = (e) => {
        if(e.target.files[0]) {
            status.innerHTML = "FILE LOADED: " + e.target.files[0].name;
            cleanBtn.style.display = "block";
        }
    };

    cleanBtn.onclick = () => {
        const file = fileIn.files[0];
        const reader = new FileReader();

        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                // Set canvas size
                vault.width = img.width;
                vault.height = img.height;
                
                // DRAWING to canvas strips EXIF because the canvas 
                // only cares about pixels, not metadata headers.
                ctx.drawImage(img, 0, 0);
                
                // Export as a fresh, clean PNG
                vault.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "CLEANED_" + file.name.split('.')[0] + ".png";
                    a.click();
                    status.innerHTML = "SCRUB COMPLETE. FILE PURIFIED.";
                }, 'image/png');
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };
</script>
</body>
</html>
